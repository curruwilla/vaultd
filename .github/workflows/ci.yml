name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"   # nightly fuzzing

permissions:
  contents: read

env:
  # golangci-lint 2.12 panics analyzing a Go 1.27 standard library; keep the
  # lint job on a toolchain it supports until that lands upstream.
  LINT_GO_VERSION: "1.25.x"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "1.25.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.LINT_GO_VERSION }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  # The M0 acceptance gate: the shipped example config must validate on a
  # machine that holds no real credentials.
  validate-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: make validate-example
      - name: an invalid config must fail the command
        run: |
          set -a; . ./examples/example.env; set +a
          unset VAULTD_AGE_RECIPIENT
          if ./bin/vaultd validate -c examples/config.yaml; then
            echo "validate accepted a config with an unresolved variable" >&2
            exit 1
          fi

  # Container-backed tests: every engine's real client against a real server,
  # and the real S3 protocol against MinIO.
  integration:
    runs-on: ubuntu-latest
    env:
      # A PostgreSQL client may never be older than the server it dumps, so the
      # image matches the client installed below. The full 14-18 matrix lands
      # with the release work in M9.
      VAULTD_TEST_PG_IMAGE: postgres:16-alpine
      VAULTD_TEST_MYSQL_IMAGE: mysql:8.0
      VAULTD_TEST_MARIADB_IMAGE: mariadb:11.4
      VAULTD_TEST_MONGO_IMAGE: mongo:7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: install the database clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 mysql-client-8.0 mariadb-client
      - name: install the MongoDB tools
        # They are not in the distribution archives; take them from the same
        # image the tests run against.
        run: |
          cid=$(docker create mongo:7)
          docker cp "$cid:/usr/bin/mongodump" mongodump
          docker cp "$cid:/usr/bin/mongorestore" mongorestore
          docker rm "$cid"
          sudo install -m 0755 mongodump mongorestore /usr/local/bin/
      - run: go test -tags integration -timeout 1800s ./...

  # A real bucket catches what MinIO cannot: R2's checksum handling,
  # conditional writes and multipart quirks. The test skips itself when the
  # secrets are absent, so forks stay green.
  e2e-r2:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      VAULTD_TEST_PG_IMAGE: postgres:16-alpine
      VAULTD_E2E_R2_ENDPOINT: ${{ secrets.VAULTD_E2E_R2_ENDPOINT }}
      VAULTD_E2E_R2_BUCKET: ${{ secrets.VAULTD_E2E_R2_BUCKET }}
      VAULTD_E2E_R2_ACCESS_KEY_ID: ${{ secrets.VAULTD_E2E_R2_ACCESS_KEY_ID }}
      VAULTD_E2E_R2_SECRET_ACCESS_KEY: ${{ secrets.VAULTD_E2E_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: install the database clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: go test -tags integration -timeout 900s -run TestBackupToRealR2 -v ./test/e2e/

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: go test ./internal/config/ -run FuzzParse -fuzz FuzzParse -fuzztime 10m
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: internal/config/testdata/fuzz/
