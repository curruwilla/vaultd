name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # The gates that already guard main, run once more against the tag itself.
  # A release is the one build nobody re-runs, so it is the one that must not
  # be taken on trust.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: make validate-example
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless signing binds the signature to this workflow's identity, so
      # there is no private key to protect or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One job per image variant (decision D1): the fat image for a multi-engine
  # config, and a slim one per engine for the common single-database case.
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: all
            suffix: ""
          - engine: pg14
            suffix: "-pg14"
          - engine: pg15
            suffix: "-pg15"
          - engine: pg16
            suffix: "-pg16"
          - engine: pg17
            suffix: "-pg17"
          - engine: pg18
            suffix: "-pg18"
          - engine: mysql8
            suffix: "-mysql8"
          - engine: mariadb11
            suffix: "-mariadb11"
          - engine: mongo7
            suffix: "-mongo7"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            ENGINE=${{ matrix.engine }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.engine }}
          cache-to: type=gha,mode=max,scope=${{ matrix.engine }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@v3
      - name: sign the image
        run: cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

  # The image is only useful if the clients inside it are the ones the config
  # names, so the release checks that rather than assuming it.
  smoke:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: doctor reports the variant and finds its clients
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          run() { docker run --rm "${REGISTRY}/${IMAGE}:${tag}${1}" "${@:2}"; }

          run "" version
          run "-pg17" version

          # A config naming an engine the slim image does not carry has to fail
          # with a message that says which image to use (decision D1).
          set -a; . ./examples/example.env; set +a
          docker run --rm -v "$PWD/examples:/cfg:ro" \
            -e VAULTD_AGE_RECIPIENT -e CF_ACCOUNT_ID -e R2_ACCESS_KEY_ID -e R2_SECRET_ACCESS_KEY \
            -e PROD_PG_DSN -e PROD_MYSQL_DSN -e PROD_MARIADB_DSN -e PROD_MONGO_URI \
            -e STAGING_PG_ADMIN_DSN -e OPS_WEBHOOK_URL -e OPS_WEBHOOK_SECRET -e VAULTD_UI_TOKEN \
            "${REGISTRY}/${IMAGE}:${tag}" validate -c /cfg/config.yaml
